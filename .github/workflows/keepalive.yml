name: Keep Repo Active

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update keepalive file
        run: |
          echo "Last update: $(date)" > .keepalive
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .keepalive
          git commit -m "keep repo active" || echo "No changes"
          git push
